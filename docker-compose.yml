services:

  ollama:
      image: ollama/ollama
      container_name: chatgpt_ollama
      ports:
        - "11434:11434"            # optional: lets you curl it from your machine
      volumes:
        - ollama_data:/root/.ollama   # models are stored here, so they survive restarts
      healthcheck:
        test: ["CMD", "ollama", "list"]
        interval: 5s
        timeout: 5s
        retries: 10

  backend:
      build:
        context: ./backend
        dockerfile: Dockerfile
      container_name: chatgpt_backend
      restart: unless-stopped
      ports:
        - "8000:8000"
      environment:
        - ENV=development
        - APP_MODULE=app.main:app
        - DATABASE_URL=postgresql+asyncpg://chat:chat@db:5432/chatdb
        - OLLAMA_URL=http://ollama:11434
        - DEFAULT_MODEL=qwen2.5:1.5b
        # Add your database connections or environment keys here:
        # - DATABASE_URL=postgresql+asyncpg://user:pass@db:5432/dbname
      volumes:
        # Mounts the local code folder into the container to enable instant hot-reloading
        - ./backend/app:/code/app
      networks:
        - app_network
      extra_hosts:
        - "host.docker.internal:host-gateway"   # needed on Linux; harmless on Mac/Windows
      depends_on:
        db:
          condition: service_healthy
        ollama:
          condition: service_healthy

  db:
      image: pgvector/pgvector:pg16   # Postgres 16 + pgvector (for memory embeddings later)
      container_name: chatgpt_db
      restart: unless-stopped
      environment:
        POSTGRES_USER: chat
        POSTGRES_PASSWORD: chat
        POSTGRES_DB: chatdb
      ports:
        - "5432:5432"
      volumes:
        - pgdata:/var/lib/postgresql/data
      healthcheck:
        test: ["CMD-SHELL", "pg_isready -U chat -d chatdb"]
        interval: 5s
        timeout: 5s
        retries: 5
      networks:
        - app_network

volumes:
  pgdata:
  ollama_data:

networks:
  app_network:
    driver: bridge
